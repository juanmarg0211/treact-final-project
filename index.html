<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treact Final Project</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/5055e67b1f.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <div class="nav__logo">
          <img class="nav__logo--img" src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" alt="Nav Logo">
          <h2 class="nav__title"><strong>Treact</strong></h2>          
        </div>
        <ul class="nav__links">
          <li><a href="#" class="nav__link link__hover-effect">About</a></li>
          <li><a href="#" class="nav__link link__hover-effect">Blog</a></li>
          <li><a href="#" class="nav__link link__hover-effect">Pricing</a></li>
          <li><a href="#" class="nav__link link__hover-effect">Contact Us</a></li>
          <div class="nav__auth">
            <li><a href="#" class="nav__link link__hover-effect">Login</a></li>
            <li><a href="#" class="nav__link nav__link--primary">Sign Up</a></li>
          </div>
        </ul>
      </div>
    </nav>
  </section>

  <section id="about">
    <div class="about__container">
      <div class="about__content">
        <h1 class="about__title">Beautiful React Templates <span class="about__title--highlight">for you.</span></h1>
        <p class="about__description">Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
        <div class="about__input--container">
          <input
            type="email"
            class="about__input"
            placeholder="Your E-mail Address"
          />
          <a href="#" class="about__button">Get Started</a>
        </div>
        <p class="about__customers">OUR TRUSTED CUSTOMERS</p>
        <img class="about__customers--img" src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Trusted Customers">
      </div>
      <div class="about__image">
        <img src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="About Treact">
      </div>
    </div>
  </section>
  
</body>
</html>
